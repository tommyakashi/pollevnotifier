name: PollEv watcher

on:
  workflow_dispatch:
    inputs:
      selftest:
        description: "Quick one-shot check instead of the full polling loop"
        type: boolean
        default: true
  schedule:
    # cron is UTC-only with no DST awareness, so each window gets two entries
    # (PDT and PST offsets); watcher.py itself verifies the real Pacific-time
    # window and exits immediately if the "wrong" one fires.
    #
    # GitHub's "schedule" event is documented as best-effort and can be
    # silently dropped (observed in practice, not just delayed), so each
    # start time gets 3 closely-spaced attempts (:00, :03, :06) as failover.
    # The concurrency group below stops redundant firings from running a
    # second overlapping poll loop if an earlier attempt already got through.
    - cron: "0,3,6 18 * * 2,4"  # religion: Tue/Thu 11:00 PDT (UTC-7)
    - cron: "0,3,6 19 * * 2,4"  # religion: Tue/Thu 11:00 PST (UTC-8)
    - cron: "0,3,6 15 * * 1,3"  # donhanna710: Mon/Wed 8:00 PDT (UTC-7)
    - cron: "0,3,6 16 * * 1,3"  # donhanna710: Mon/Wed 8:00 PST (UTC-8)

concurrency:
  group: pollev-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run watcher
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WATCHER_SELFTEST: ${{ (github.event_name == 'workflow_dispatch' && inputs.selftest) && '1' || '' }}
        run: python watcher.py
